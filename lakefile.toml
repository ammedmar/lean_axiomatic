name = "lean_axiomatic"
version = "0.1.0"
defaultTargets = ["LeanAxiomatic"]
# Shared dependency folder for all projects in lean/ (one Mathlib pin for all)
packagesDir = "../.lean-packages"

[leanOptions]
autoImplicit = false
# Mathlib's standard style linters (naming, documentation, formatting)
weak.linter.mathlibStandardSet = true
# The header linter requires Mathlib's Apache-2.0 copyright block; the licence
# is not yet chosen, so it is disabled until then.
weak.linter.style.header = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[lean_lib]]
name = "LeanAxiomatic"
